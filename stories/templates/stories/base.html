{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Story Teller Generator{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'stories/css/style.css' %}">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="container nav-wrap">
                <a href="{% url 'home' %}" class="brand">📖 Story Teller Generator</a>
                <nav class="main-nav">
                    <a href="{% url 'home' %}">Home</a>
                    <a href="{% url 'generate_story' %}">Generate Story</a>
                    <a href="{% url 'story_history' %}">Story History</a>
                    <a href="{% url 'about' %}">About</a>
                </nav>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'stories/js/script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
