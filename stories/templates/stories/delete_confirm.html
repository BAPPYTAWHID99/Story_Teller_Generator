{% extends 'stories/base.html' %}

{% block title %}Delete Story{% endblock %}

{% block content %}
<div class="container page-padding narrow">
    <div class="glass-card confirm-card">
        <span class="eyebrow">Delete Story</span>
        <h2>Are you sure you want to delete this story?</h2>
        <p><strong>{{ story.title }}</strong></p>
        <div class="confirm-actions">
            <a href="{% url 'story_detail' story.pk %}" class="secondary-btn">Cancel</a>
            <form method="post" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="danger-btn">Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
